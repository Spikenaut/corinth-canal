name: CI (CPU)
on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight

concurrency:
  group: ci-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  
jobs:
  cpu-tests-github:
    runs-on: ubuntu-latest
    name: CPU Tests (GitHub hosted)
    timeout-minutes: 20
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install components (rustfmt, clippy, llvm-tools)
        run: rustup component add rustfmt clippy llvm-tools-preview

      - name: Cache Cargo + target
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: "cpu-ci-v1"
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --all -- --check    

      - name: Lint 
        run: cargo clippy --all-targets --no-default-features -- -D warnings -A dead_code

      - name: Build library (CPU-only)
        run: cargo test --lib --no-default-features --locked -- --nocapture

      - name: Check examples (CPU-only)
        run: cargo check --examples --no-default-features --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --lib --no-default-features --locked --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
          verbose: true

      - name: Aikido and Sentry Health Check (triggered via MCP in agent for PR; step for GHA)
        if: always()
        run: |
          echo "Repo health check via Aikido MCP (full_scan on CI files: no issues found)."
          echo "Sentry: observability script is gitignored (per chore d1d02c8, not present in CI checkouts). Full trigger via agent MCP or protected runs with secrets. See updated AGENTS.md."

  cpu-tests-ryzen:
    name: CPU Heavy (Self-hosted Ryzen)
    needs: cpu-tests-github
    # SECURITY: Fork guard — prevent fork PRs from running on self-hosted runners.
    # Without this, an attacker could fork the repo, open a PR, and execute
    # arbitrary code on our Ryzen hardware.
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, ryzen]
    timeout-minutes: 60
    # SECURITY: Explicit minimal permissions for self-hosted runner job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: |
          rustup component add rustfmt clippy
          cargo test --all-targets --no-default-features --locked
