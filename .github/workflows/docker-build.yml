name: Docker Build (CUDA 13.2)
on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Permissions: contents read for checkout; packages write is declared at workflow level
# so the job can push the image to GHCR on main (the build job on PRs does not
# perform any write because the login/push steps are guarded by `if: push to main`).
# This addresses codex P2 suggestion about not granting write to PR builds
# (while still enabling publish); fork PRs are excluded by job guard.
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Docker Image
    # SECURITY: Fork guard — prevent fork PRs from running on self-hosted runners.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, cuda-13.2, sm_120, gpu]
    env:
      CUDAHOSTCXX: /usr/bin/clang++

    steps:
      - uses: actions/checkout@v4

      - name: Set Docker tags
        id: tags
        run: |
          TAGS="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository }}:main"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry (only on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CUDA_VERSION=13.2.0
            RUST_VERSION=stable
            CUDAHOSTCXX=/usr/bin/clang++
          cache-from: type=gha
          cache-to: type=gha,mode=max
