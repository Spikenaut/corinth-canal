# Snyk security scanning for Rust (SCA + SAST).
# Gated on SNYK_TOKEN repository secret — skipped silently when not configured.
# Third-party Actions pinned to immutable SHAs (supply-chain policy).
name: Snyk Security Scan

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  snyk-sca:
    name: Snyk SCA
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Snyk CLI
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Snyk test
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: snyk test --all-projects --severity-threshold=high

      - name: Snyk monitor
        if: env.SNYK_TOKEN != '' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: snyk monitor --all-projects

  snyk-code:
    name: Snyk Code (SAST)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install Snyk CLI
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Snyk code test
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: |
          snyk code test --severity-threshold=high --json-file-output=snyk-code.json || true
          snyk-to-sarif || true

      - name: Upload SARIF
        if: env.SNYK_TOKEN != '' && always()
        uses: github/codeql-action/upload-sarif@e8e8e51caba890f74f97e228d00b0b81b666ee4c # v3
        with:
          sarif_file: snyk-code.sarif
        continue-on-error: true

  # rustsec audit (free, no token needed — matches neuromod audit.yml)
  rustsec:
    name: RustSec Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
