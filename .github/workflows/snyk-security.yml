# Security audit workflow — RustSec only.
# Snyk scanning is handled by the Snyk GitHub App (PR check "code/snyk")
# and on-demand via Snyk MCP tools (see AGENTS.md GH#108). Do not re-add
# Snyk CLI jobs here: job-level `if: secrets.SNYK_TOKEN != ''` caused the
# workflow to fail with 0 jobs on every push (invalid secret context use).
name: Security Audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rustsec:
    name: RustSec Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
