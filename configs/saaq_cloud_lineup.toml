# corinth-canal SAAQ 1.5 cloud model lineup.
#
# Parsed by cloud lineup helpers in examples/support/mod.rs.
# This file is cloud metadata scaffolding; main example runners may wire it
# in separately. Each [[model]] entry is a cloud metadata stub — corinth-canal
# does not create, provision, or tear down cloud resources.
#
# Cloud execution is delegated to Dioscuri-Cloud. This file records
# metadata for fail-fast validation of required provider env vars.
# Wire-up note: this file is NOT yet loaded by `examples/saaq_latent_calibration.rs`.
# The parsing helpers (`load_cloud_lineup`, `cloud_execution_guard`) exist
# in `examples/support/mod.rs` and are tested, but the runner does not
# invoke them yet. For now this config serves as a documented inventory
# and validator for `cloud_execution_guard` unit tests.
#
# Fields:
#   slug                directory-safe identifier (used in artifact paths)
#   family              optional model family for routing tensor selection
#                       one of: olmoe | qwen3_moe | gemma4 | deepseek2 | llama_moe | zaya | glm4
#                       leave blank when no existing corinth-canal family matches
#   cloud_model_id      provider-qualified model identifier (passed to Dioscuri-Cloud)
#   source_url          canonical model card or provider listing
#   target              execution target: "cloud"
#   architecture        model class: "moe" | "dense"
#   active_params       known active parameter count (informational)
#   total_params        total parameter count including shared weights (informational)
#   provider_format     expected runtime format on the cloud side
#   required_env_vars   env var names required for cloud execution (no secrets)
#
# ── SAAQ campaign tags (per-model overrides in artifact manifests) ──
# Defaults applied by the runner unless overridden per-entry:
#   SAAQ_RULE        = "saaq_v1_5"
#   TELEMETRY_SOURCE = "synthetic" | "csv"
#   REPEAT_COUNT     = 2
#
# No Terraform, no cloud credentials, no provider SDK code.

# ── MET-57: Skywork/Skywork-MoE-Base-FP8 (FP8 MoE, cloud-only) ──
[[model]]
slug = "skywork_moe_base_fp8_cloud"
family = "qwen3_moe"
cloud_model_id = "Skywork/Skywork-MoE-Base-FP8"
source_url = "https://huggingface.co/Skywork/Skywork-MoE-Base-FP8"
target = "cloud"
architecture = "moe"
active_params = "3.7B"
total_params = "16B"
provider_format = "fp8-safetensors"
required_env_vars = ["SKYWORK_FP8_ENDPOINT", "SKYWORK_FP8_API_KEY"]



# ── MET-62: google/gemma-4-26b-a4b-it (MoE, existing local GGUF + cloud) ──
[[model]]
slug = "gemma4_26b_a4b_cloud"
family = "gemma4"
cloud_model_id = "google/gemma-4-26B-A4B-it"
source_url = "https://huggingface.co/google/gemma-4-26B-A4B-it"
target = "cloud"
architecture = "moe"
active_params = "4B"
total_params = "26B"
provider_format = "vertex-ai"
required_env_vars = ["VERTEX_AI_PROJECT_ID", "VERTEX_AI_LOCATION", "VERTEX_AI_ENDPOINT_ID"]

