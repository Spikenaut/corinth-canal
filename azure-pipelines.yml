# Azure Pipelines cross-platform CPU CI (modelled on Limen-Neural/neuromod).
# Third-party tasks pinned to versions for reproducibility.
# See GH#109 for details. GPU/CUDA, Docker, Sentry remain on GitHub Actions.
#
# Free-tier posture (2026-07):
# - ACTIVE: self-hosted Linux agent in the Default pool (ShipOfTheseus / ~/myagent)
#   on pushes to main only.
#   Does NOT use Microsoft-hosted free minutes.
# - DISABLED (not deleted): Microsoft-hosted 3-OS vmImage matrix (burns free minutes).
#   Re-enable that block when Limen-Neural has hosted free minutes again.
#
# SECURITY: Self-hosted jobs execute repository-authored code on a shared host.
# Do not run this pipeline directly for PR validation: Azure evaluates merged
# PR-authored YAML before scheduling jobs, so a YAML-level fork/same-repo gate is
# not a reliable boundary for protecting the Default self-hosted pool. Use GitHub
# Actions or an Azure pipeline definition kept outside PR-authored YAML for PRs.
#
# Agent must be online or jobs queue: cd ~/myagent && ./run.sh
# First-time: open a stuck build and "Permit" the pipeline to use pool Default
# (Checkpoint.Authorization). Org settings → Agent pools → Default → Security.

trigger:
  branches:
    include:
      - main

# Self-hosted Azure PR validation is disabled here. A fork/same-repo gate inside
# this PR-authored YAML can be edited by the same PR before Azure schedules the
# Default self-hosted pool. Keep PR validation on GitHub Actions or in an Azure
# pipeline definition that PR authors cannot modify.
pr: none

# ---------------------------------------------------------------------------
# ACTIVE: self-hosted Linux (Default pool). Start agent: cd ~/myagent && ./run.sh
# ---------------------------------------------------------------------------
jobs:
- job: BuildTest_SelfHosted_Linux
  displayName: 'CPU Tests (self-hosted Linux)'
  # This pipeline is not a PR boundary; `pr: none` above prevents PR-authored
  # YAML from scheduling the self-hosted Default pool.
  condition: succeeded()
  pool:
    name: Default
    # Optional pin to this machine once registered:
    # demands:
    # - Agent.Name -equals ShipOfTheseus
  steps:
  - checkout: self
    persistCredentials: 'false'

  - bash: |
      set -euo pipefail
      export CARGO_HOME="$HOME/.cargo"
      export RUSTUP_HOME="$HOME/.rustup"
      mkdir -p "$CARGO_HOME/bin"

      # Require rustup (not bare rustc): later steps call `rustup component add`.
      if ! command -v rustup >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain stable --no-modify-path
      fi

      # Always put the install root on PATH (workspace or home — matches CARGO_HOME).
      echo "##vso[task.prependpath]${CARGO_HOME}/bin"
      export PATH="${CARGO_HOME}/bin:${PATH}"

      if [ -f "${CARGO_HOME}/env" ]; then
        # shellcheck source=/dev/null
        . "${CARGO_HOME}/env"
      fi

      # Ensure a default toolchain exists under this RUSTUP_HOME (fresh workspaces).
      if ! rustup show active-toolchain >/dev/null 2>&1; then
        rustup default stable
      fi

      rustup --version
      rustc --version
      cargo --version
    displayName: 'Ensure rustup toolchain'

  - script: |
      export CARGO_HOME="$HOME/.cargo"
      export RUSTUP_HOME="$HOME/.rustup"
      export PATH="${CARGO_HOME}/bin:${PATH}"
      rustup component add rustfmt clippy llvm-tools-preview
    displayName: 'Install components'

  - script: |
      export CARGO_HOME="$HOME/.cargo"
      export RUSTUP_HOME="$HOME/.rustup"
      export PATH="${CARGO_HOME}/bin:${PATH}"
      cargo fmt --all -- --check
    displayName: 'Format check'

  - script: |
      export CARGO_HOME="$HOME/.cargo"
      export RUSTUP_HOME="$HOME/.rustup"
      export PATH="${CARGO_HOME}/bin:${PATH}"
      cargo clippy --all-targets --no-default-features -- -D warnings -A dead_code
    displayName: 'Clippy (no-default)'

  - script: |
      export CARGO_HOME="$HOME/.cargo"
      export RUSTUP_HOME="$HOME/.rustup"
      export PATH="${CARGO_HOME}/bin:${PATH}"
      cargo test --lib --no-default-features --locked
    displayName: 'Test (no-default)'

  - script: |
      export CARGO_HOME="$HOME/.cargo"
      export RUSTUP_HOME="$HOME/.rustup"
      export PATH="${CARGO_HOME}/bin:${PATH}"
      cargo check --examples --no-default-features --locked
    displayName: 'Check examples (no-default)'

  - bash: |
      set -euo pipefail
      export CARGO_HOME="$HOME/.cargo"
      export RUSTUP_HOME="$HOME/.rustup"
      export PATH="${CARGO_HOME}/bin:${PATH}"
      cargo install cargo-llvm-cov --locked
      # cargo install puts binaries under CARGO_HOME/bin — already on PATH above.
      cargo llvm-cov --lib --no-default-features --locked --lcov --output-path lcov.info
    displayName: 'Coverage (llvm-cov)'
    continueOnError: true

