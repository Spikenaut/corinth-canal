# Azure Pipelines cross-platform CPU CI (modelled on Limen-Neural/neuromod).
# Third-party tasks pinned to versions for reproducibility.
# See GH#109 for details. GPU/CUDA, Docker, Sentry remain on GitHub Actions.

trigger:
  branches:
    include:
      - main
pr:
  branches:
    include:
      - main
  autoCancel: false

variables:
  CARGO_HOME: $(Pipeline.workspace)/.cargo
  RUSTUP_HOME: $(Pipeline.workspace)/.rustup

jobs:
- job: BuildTest
  strategy:
    matrix:
      linux:
        imageName: 'ubuntu-latest'
      windows:
        imageName: 'windows-latest'
      mac:
        imageName: 'macos-latest'
  pool:
    vmImage: $(imageName)

  steps:
  - checkout: self
    persistCredentials: 'false'

  - task: Cache@2
    displayName: 'Rust Cache'
    inputs:
      key: 'cargo | "$(Agent.OS)" | Cargo.lock'
      restoreKeys: |
        cargo | "$(Agent.OS)"
      path: $(CARGO_HOME)

  - bash: |
      export CARGO_HOME="$(CARGO_HOME)"
      export RUSTUP_HOME="$(RUSTUP_HOME)"
      mkdir -p "$CARGO_HOME/bin"
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      echo "##vso[task.prependpath]$CARGO_HOME/bin"
    displayName: 'Install Rust (rustup) - Unix'
    condition: ne(variables['Agent.OS'], 'Windows_NT')

  - powershell: |
      $env:CARGO_HOME = "$(CARGO_HOME)"
      $env:RUSTUP_HOME = "$(RUSTUP_HOME)"
      New-Item -ItemType Directory -Force -Path "$env:CARGO_HOME\bin" | Out-Null
      Invoke-WebRequest -Uri https://win.rustup.rs/ -OutFile rustup-init.exe
      .\rustup-init.exe -y --default-toolchain stable --no-modify-path
      Write-Host "##vso[task.prependpath]$env:CARGO_HOME\bin"
    displayName: 'Install Rust (rustup) - Windows'
    condition: eq(variables['Agent.OS'], 'Windows_NT')

  - script: rustup component add rustfmt clippy llvm-tools-preview
    displayName: 'Install components'

  - script: cargo fmt --all -- --check
    displayName: 'Format check'

  - script: cargo clippy --all-targets --no-default-features -- -D warnings -A dead_code
    displayName: 'Clippy (no-default)'

  - script: cargo test --lib --no-default-features --locked
    displayName: 'Test (no-default)'

  - script: cargo check --examples --no-default-features --locked
    displayName: 'Check examples (no-default)'

  - bash: |
      export CARGO_HOME="$(CARGO_HOME)"
      cargo install cargo-llvm-cov --locked
      cargo llvm-cov --lib --no-default-features --locked --lcov --output-path lcov.info
    displayName: 'Coverage (llvm-cov)'
    continueOnError: true
    condition: eq(variables['imageName'], 'ubuntu-latest')
