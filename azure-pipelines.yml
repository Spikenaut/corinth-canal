# Azure Pipelines cross-platform CPU CI
# See GH#109 for details. Runs in parallel with GitHub Actions for macOS/Windows/Linux coverage.
# Non-goals: GPU/CUDA, Docker, Sentry (remain on GitHub Actions).

trigger:
  branches:
    include:
    - main
pr:
  branches:
    include:
    - main

variables:
  RUST_VERSION: stable

jobs:
- job: Linux
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - checkout: self
  - script: rustup default $(RUST_VERSION)
    displayName: 'Install Rust'
  - script: cargo fmt --all -- --check
    displayName: 'cargo fmt check'
  - script: cargo clippy --all-targets --no-default-features -- -D warnings -A dead_code
    displayName: 'cargo clippy (no-default, fail on warnings)'
  - script: cargo test --lib --no-default-features --locked
    displayName: 'cargo test --lib (no-default)'
  - script: cargo check --examples --no-default-features --locked
    displayName: 'cargo check --examples (no-default)'
  - script: cargo install cargo-llvm-cov --locked
    displayName: 'Install cargo-llvm-cov'
  - script: cargo llvm-cov --lib --no-default-features --locked --lcov --output-path lcov.info
    displayName: 'cargo llvm-cov (LCOV)'
  # Note: coverage upload to Codecov is informational here; see codecov.yml and open questions in #109

- job: macOS
  pool:
    vmImage: 'macos-latest'
  steps:
  - checkout: self
  - script: rustup default $(RUST_VERSION)
    displayName: 'Install Rust'
  - script: cargo fmt --all -- --check
    displayName: 'cargo fmt check'
  - script: cargo clippy --all-targets --no-default-features -- -D warnings -A dead_code
    displayName: 'cargo clippy (no-default, fail on warnings)'
  - script: cargo test --lib --no-default-features --locked
    displayName: 'cargo test --lib (no-default)'
  - script: cargo check --examples --no-default-features --locked
    displayName: 'cargo check --examples (no-default)'
  - script: cargo install cargo-llvm-cov --locked
    displayName: 'Install cargo-llvm-cov'
  - script: cargo llvm-cov --lib --no-default-features --locked --lcov --output-path lcov.info
    displayName: 'cargo llvm-cov (LCOV)'

- job: Windows
  pool:
    vmImage: 'windows-latest'
  steps:
  - checkout: self
  - script: rustup default $(RUST_VERSION)
    displayName: 'Install Rust'
  - script: cargo fmt --all -- --check
    displayName: 'cargo fmt check'
  - script: cargo clippy --all-targets --no-default-features -- -D warnings -A dead_code
    displayName: 'cargo clippy (no-default, fail on warnings)'
  # NOTE: Windows CI is now enabled (no longer gated) after cross-platform fix in
  # src/moe/checkpoint.rs (page_size_bytes now has #[cfg(not(unix))] fallback).
  # This addresses chatgpt-codex P2 "Gate Windows CI until the crate builds there".
  # The no-default build now succeeds on windows (the library no longer unconditionally
  # includes unix-only page size code in the always-compiled moe module).
  - script: cargo test --lib --no-default-features --locked
    displayName: 'cargo test --lib (no-default)'
  - script: cargo check --examples --no-default-features --locked
    displayName: 'cargo check --examples (no-default)'
  - script: cargo install cargo-llvm-cov --locked
    displayName: 'Install cargo-llvm-cov'
  - script: cargo llvm-cov --lib --no-default-features --locked --lcov --output-path lcov.info
    displayName: 'cargo llvm-cov (LCOV)'

# Caching note: Azure Pipelines Cargo cache can be added via Cache@2 task for target/ and registry if build times become issue.
# See open questions in #109 for coverage upload and required vs informational.

# Note on GitHub visibility (for PR #112 and follow-ups):
# Azure Pipelines results do NOT appear automatically in GitHub "Actions" or PR checks UI
# even when builds run (see azure run on refs/pull/112/merge).
# To surface them:
# 1. Install "Azure Pipelines" GitHub App on the rmems org/repo (required for auto reporting).
# 2. Ensure the GitHub service connection (id d5f8216d-... "Limen-Neural") in Azure DevOps
#    has "repo:status" and "repo:write" scopes and is authorized.
# 3. Update pipeline default branch (done via az): az pipelines update --id 3 --branch main \
#    --org https://dev.azure.com/Limen-Neural --project "CI CD"
# 4. If still not visible on a PR, force a status (using gh cli):
#    gh api repos/rmems/corinth-canal/statuses/<head-sha> --method POST \
#      -f state=pending -f context="Azure Pipelines" \
#      -f description="Azure Pipelines cross-platform CPU CI" \
#      -f target_url="https://dev.azure.com/Limen-Neural/CI%20CD/_build/results?buildId=<id>"
# This posts a commit status that GitHub surfaces in the PR checks.
# Pipeline id 3 (corinth-canal-cross-platform) is the active one for this repo.
